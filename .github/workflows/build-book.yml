name: Build Jupyter Book

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CUSTOM_DOMAIN: qutip.daweslab.com

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-html-pip-${{ hashFiles('.github/workflows/build-book.yml') }}
          restore-keys: |
            ${{ runner.os }}-html-pip-

      - name: Cache execution outputs
        uses: actions/cache@v5
        with:
          path: _build/execute
          key: ${{ runner.os }}-execute-${{ hashFiles('myst.yml', 'features/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-execute-

      - name: Install Python build + execution dependencies
        run: |
          pip install mystmd numpy scipy matplotlib sympy "qutip>=5" ipykernel jupyter-server

      - name: Configure NumPy scalar display for executed notebooks
        run: |
          mkdir -p ~/.ipython/profile_default/startup
          printf 'import numpy as np\nnp.set_printoptions(legacy="1.25")\n' \
            > ~/.ipython/profile_default/startup/00-numpy-printoptions.py

      - name: Build HTML site
        run: myst build --execute --html

      # PDF build is intentionally disabled in CI while formatting is being tuned.
      # Run locally with: myst build --execute --pdf
      # - name: Build HTML site and PDF
      #   run: myst build --execute --html --pdf

      # - name: Upload PDF artifact
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: jupyter-book-pdf
      #     path: exports/book.pdf
      #     if-no-files-found: warn

      - name: Add CNAME for custom domain
        run: echo "${{ env.CUSTOM_DOMAIN }}" > _build/html/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # Only deploy on push/dispatch; skip on pull_request builds
    if: github.event_name != 'pull_request'
    needs: build-html
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
